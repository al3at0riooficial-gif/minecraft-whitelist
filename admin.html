<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Whitelist Minecraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
        }

        .card {
            background: #181b21;
            border: 1px solid #292e38;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border-radius: 9px;
            border: 1px solid #343a46;
            background: #101217;
            color: white;
            font-size: 15px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #5cdb72;
            color: #101217;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.08);
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        #panel {
            display: none;
        }

        .user {
            background: #101217;
            border: 1px solid #343a46;
            border-radius: 9px;
            padding: 13px;
            margin-top: 10px;
        }

        .logout {
            margin-top: 20px;
            background: #39404c;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card" id="login">
        <h1>Admin</h1>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button id="loginButton">Entrar</button>

        <p id="message"></p>
    </div>

    <div class="card" id="panel">
        <h1>Whitelist</h1>

        <div id="users"></div>

        <button class="logout" id="logoutButton">
            Terminar sessão
        </button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xxhlvypvgkfsxgwcanok.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_YyVV94dbqcs7GMclow6Muw_1j1cSr-L";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const login = document.getElementById("login");
const panel = document.getElementById("panel");
const message = document.getElementById("message");
const users = document.getElementById("users");

document.getElementById("loginButton").addEventListener("click", async () => {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    message.textContent = "A entrar...";

    const { error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        message.style.color = "#ff5c5c";
        message.textContent = "Email ou password incorretos.";
        return;
    }

    message.textContent = "";

    login.style.display = "none";
    panel.style.display = "block";

    carregarWhitelist();
});

async function carregarWhitelist() {

    users.innerHTML = "A carregar...";

    const { data, error } = await supabase
        .from("whitelist_requests")
        .select("username, created_at")
        .order("created_at", { ascending: false });

    if (error) {
        users.innerHTML = "Erro ao carregar a whitelist.";
        console.log(error);
        return;
    }

    if (data.length === 0) {
        users.innerHTML = "Ainda não existem pedidos.";
        return;
    }

    users.innerHTML = "";

    data.forEach(user => {

        const div = document.createElement("div");

        div.className = "user";

        const date = new Date(user.created_at);

        div.textContent =
            user.username +
            " — " +
            date.toLocaleString("pt-PT");

        users.appendChild(div);
    });
}

document.getElementById("logoutButton").addEventListener("click", async () => {

    await supabase.auth.signOut();

    panel.style.display = "none";
    login.style.display = "block";
});
</script>

</body>
</html>
